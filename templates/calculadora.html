<!-- Modal Calculadora Financiera Avanzada -->
<div id="modalCalculadora" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden border border-gray-100 flex flex-col max-h-[90vh]">
        
        <!-- Cabecera -->
        <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center text-white">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-calculator text-lg"></i>
                <h3 class="font-bold text-base">Calculadora Financiera</h3>
            </div>
            <button onclick="toggleModalCalculadora()" class="text-indigo-200 hover:text-white transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="p-6 overflow-y-auto space-y-4 flex-1">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Monto del Préstamo *</label>
                    <input type="number" id="calc-monto" placeholder="0.00" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Tipo de Amortización *</label>
                    <select id="calc-amortizacion" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm">
                        <option value="" disabled selected>Seleccionar tipo</option>
                        <option value="frances">Cuota Fija (Francés)</option>
                        <option value="aleman">Disminuir Cuota (Alemán)</option>
                        <option value="interes_fijo">Interés Fijo</option>
                        <option value="capital_final">Capital al Final (Americano)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Modalidad de Pago *</label>
                    <select id="calc-modalidad" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm">
                        <option value="" disabled selected>Seleccionar modalidad</option>
                        <option value="diario">Diario</option>
                        <option value="semanal">Semanal</option>
                        <option value="quincenal">Quincenal</option>
                        <option value="mensual">Mensual</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1"># Cuotas *</label>
                    <input type="number" id="calc-cuotas" placeholder="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Monto de Cuotas *</label>
                    <input type="number" id="calc-resultado-cuota" readonly placeholder="0.00" class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-gray-700 font-bold text-sm">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Primer Pago *</label>
                    <input type="date" id="calc-fecha" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Interés (%)</label>
                    <div class="relative">
                        <input type="number" step="any" id="calc-interes" placeholder="0.00" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm pr-8">
                        <span class="absolute right-3 top-2.5 text-gray-400 font-bold text-sm">%</span>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-1">Comisión</label>
                    <div class="relative">
                        <input type="number" step="any" id="calc-comision" placeholder="0.00" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm pr-8">
                        <span class="absolute right-3 top-2.5 text-gray-400 font-bold text-sm">%</span>
                    </div>
                </div>
            </div>
            <p class="text-[11px] text-gray-400 italic">Ingresa el monto, cuotas e interés para calcular el valor de la cuota automáticamente.</p>
        </div>

        <!-- Pie / Botón de Acción -->
        <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-3">
            <button onclick="toggleModalCalculadora()" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl transition text-sm">
                Cerrar
            </button>
            <button onclick="calcularPrestamoFinanciero()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">
                CALCULAR
            </button>
        </div>
    </div>
</div>

<script>
    function toggleModalCalculadora() {
        const modal = document.getElementById('modalCalculadora');
        if (modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        } else {
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }
    }

    function calcularPrestamoFinanciero() {
        const monto = parseFloat(document.getElementById('calc-monto').value) || 0;
        const cuotas = parseInt(document.getElementById('calc-cuotas').value) || 0;
        const interes = parseFloat(document.getElementById('calc-interes').value) || 0;

        if (monto <= 0 || cuotas <= 0) {
            alert('Por favor ingresa un monto y un número de cuotas válidos.');
            return;
        }

        // Cálculo básico de cuota fija con interés simple/compuesto según fórmula comercial
        let totalInteres = (monto * (interes / 100)) * cuotas;
        let totalPagar = monto + totalInteres;
        let valorCuota = totalPagar / cuotas;

        document.getElementById('calc-resultado-cuota').value = valorCuota.toFixed(2);
    }
</script>
