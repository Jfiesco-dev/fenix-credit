<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fenix Credit{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-900 min-h-screen font-sans antialiased text-gray-800 flex flex-col">

    <!-- Barra de Navegación Superior / Menú Adaptable -->
    {% if session.get('user_id') %}
    <header class="bg-indigo-950 border-b border-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logotipo y Nombre -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30 text-white font-bold">
                    <i class="fa-solid fa-vault"></i>
                </div>
                <span class="font-extrabold text-lg tracking-tight">Fenix Credit</span>
            </div>

            <!-- Enlaces de navegación rápidos o botón de salida -->
            <div class="flex items-center gap-3">
                <a href="{{ url_for('dashboard') }}" class="text-sm px-3 py-2 rounded-lg bg-indigo-900/50 hover:bg-indigo-900 transition text-gray-200 font-medium hidden sm:inline-block">
                    <i class="fa-solid fa-chart-pie mr-1"></i> Dashboard
                </a>
                <a href="{{ url_for('login') }}" class="text-sm px-3 py-2 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 transition font-medium flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Salir</span>
                </a>
            </div>
        </div>
    </header>
    {% endif %}

    <!-- Contenedor Principal Dinámico -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 animate-fade">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página sutil -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800 mt-auto">
        Fenix Credit &copy; {{ 2026 }} - Sistema de Gestión de Préstamos
    </footer>

</body>
</html>
