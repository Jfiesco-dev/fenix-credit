<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicita tu Préstamo - Fenix Credit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 font-sans flex items-center justify-center min-h-screen p-6">

    <div class="bg-white max-w-lg w-full p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center text-xl font-bold shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-hand-holding-dollar"></i>
            </div>
            <h1 class="text-xl font-extrabold text-gray-800">Solicita tu Préstamo en Línea</h1>
            <p class="text-xs text-gray-500">Completa tus datos y nos comunicaremos contigo pronto.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('portal_solicitud') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Nombre Completo</label>
                <input type="text" name="nombre" required class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Teléfono / WhatsApp</label>
                    <input type="text" name="telefono" required class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" name="email" class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Monto que necesitas</label>
                    <input type="number" step="any" name="monto" required class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Plazo en Cuotas</label>
                    <input type="number" name="cuotas" required class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">¿Para qué destinarás el dinero?</label>
                <textarea name="motivo" rows="2" class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs font-semibold rounded-xl px-4 py-3 outline-none focus:border-indigo-500 resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition">
                Enviar Solicitud
            </button>
        </form>
    </div>

</body>
</html>
