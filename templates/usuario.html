<style>
    @keyframes fadeInUsuarioGlobal {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dropdown-usuario-global.show-usuario-global {
        animation: fadeInUsuarioGlobal 0.18s ease-out forwards;
    }
    .backdrop-usuario-global.show-usuario-global {
        display: flex !important;
    }
</style>

<div class="relative usuario-global-wrapper">
    <button type="button"
        class="btn-usuario-global w-9 h-9 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-sm hover:bg-indigo-700 transition focus:outline-none overflow-hidden shrink-0">
        {% if usuario_actual and usuario_actual.foto %}
            <img src="{{ url_for('foto_perfil', nombre_archivo=usuario_actual.foto) }}" alt="Foto de perfil" class="w-full h-full object-cover">
        {% else %}
            <i class="fa-solid fa-user"></i>
        {% endif %}
    </button>

    <!-- Fondo oscuro solo en móvil -->
    <div class="backdrop-usuario-global hidden fixed inset-0 bg-slate-900/50 z-[9998] items-start sm:items-center justify-center p-4 pt-20 sm:p-0"></div>

    <div class="dropdown-usuario-global hidden fixed sm:absolute left-4 right-4 sm:left-auto sm:right-0 top-20 sm:top-auto sm:mt-3 mx-auto sm:mx-0 w-auto sm:w-96 max-w-sm bg-white rounded-2xl shadow-2xl border border-gray-100 z-[9999] overflow-hidden max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 pt-4">
            <p class="text-xs font-semibold text-gray-500 truncate">{{ usuario_actual.email if usuario_actual else 'Usuario' }}</p>
            <button type="button" class="btn-cerrar-dropdown-usuario w-7 h-7 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition shrink-0">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <form action="{{ url_for('actualizar_perfil') }}" method="POST" enctype="multipart/form-data" class="px-6 pt-4 pb-2">
            <div class="flex flex-col items-center">
                <div class="relative">
                    <div class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-md overflow-hidden" id="preview-foto-perfil-wrapper">
                        {% if usuario_actual and usuario_actual.foto %}
                            <img src="{{ url_for('foto_perfil', nombre_archivo=usuario_actual.foto) }}" alt="Foto de perfil" class="w-full h-full object-cover" id="preview-foto-perfil">
                        {% else %}
                            <i class="fa-solid fa-user" id="preview-foto-perfil-icono"></i>
                        {% endif %}
                    </div>
                    <label for="input-foto-perfil" class="absolute -bottom-1 -right-1 w-7 h-7 bg-white border border-gray-200 rounded-full flex items-center justify-center text-indigo-600 shadow-md cursor-pointer hover:bg-indigo-50 transition">
                        <i class="fa-solid fa-camera text-xs"></i>
                    </label>
                    <input type="file" name="foto" id="input-foto-perfil" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp" class="hidden">
                </div>

                {% if usuario_actual and usuario_actual.foto %}
                <button type="submit" formaction="{{ url_for('eliminar_foto_perfil') }}" class="mt-2 text-[11px] font-bold text-red-500 hover:text-red-600 transition">
                    Quitar foto
                </button>
                {% endif %}

                <div class="w-full mt-4">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Nombre</label>
                    <input type="text" name="nombre" value="{{ usuario_actual.nombre if usuario_actual and usuario_actual.nombre else '' }}" placeholder="Tu nombre" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="w-full mt-3">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Correo</label>
                    <input type="text" value="{{ usuario_actual.email if usuario_actual else '' }}" disabled class="w-full px-3 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-sm font-semibold text-gray-500 cursor-not-allowed">
                </div>

                <span class="mt-3 text-[10px] font-bold uppercase tracking-wider text-emerald-500 bg-emerald-50 px-2.5 py-1 rounded-full">Sesión activa</span>

                <button type="submit" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-3 rounded-xl transition">
                    Guardar Cambios
                </button>
            </div>
        </form>

        <div class="px-6 pb-4 pt-1">
            <a href="{{ url_for('logout') }}"
                class="w-full flex items-center justify-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-4 py-3 rounded-xl transition">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</div>

<script>
(function () {
    if (window.__usuarioGlobalInit) return;
    window.__usuarioGlobalInit = true;

    function cerrarTodosUsuarioGlobal() {
        document.querySelectorAll('.dropdown-usuario-global').forEach(function (dd) {
            dd.classList.remove('show-usuario-global');
            dd.classList.add('hidden');
        });
        document.querySelectorAll('.backdrop-usuario-global').forEach(function (bd) {
            bd.classList.remove('show-usuario-global');
            bd.classList.add('hidden');
        });
    }

    function abrirUsuarioGlobal(wrapper) {
        cerrarTodosUsuarioGlobal();
        var dropdown = wrapper.querySelector('.dropdown-usuario-global');
        var backdrop = wrapper.querySelector('.backdrop-usuario-global');
        if (dropdown) {
            dropdown.classList.remove('hidden');
            dropdown.classList.add('show-usuario-global');
        }
        if (backdrop) {
            backdrop.classList.remove('hidden');
            backdrop.classList.add('show-usuario-global');
        }
    }

    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.btn-usuario-global');
        if (btn) {
            var wrapper = btn.closest('.usuario-global-wrapper');
            var dropdown = wrapper ? wrapper.querySelector('.dropdown-usuario-global') : null;
            var yaAbierto = dropdown && dropdown.classList.contains('show-usuario-global');
            if (yaAbierto) {
                cerrarTodosUsuarioGlobal();
            } else if (wrapper) {
                abrirUsuarioGlobal(wrapper);
            }
            return;
        }

        if (e.target.closest('.btn-cerrar-dropdown-usuario')) {
            cerrarTodosUsuarioGlobal();
            return;
        }

        if (e.target.closest('.backdrop-usuario-global')) {
            cerrarTodosUsuarioGlobal();
            return;
        }

        if (!e.target.closest('.dropdown-usuario-global')) {
            cerrarTodosUsuarioGlobal();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') cerrarTodosUsuarioGlobal();
    });

    document.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'input-foto-perfil' && e.target.files && e.target.files[0]) {
            var reader = new FileReader();
            var wrapper = e.target.closest('form').querySelector('#preview-foto-perfil-wrapper');
            reader.onload = function (ev) {
                wrapper.innerHTML = '<img src="' + ev.target.result + '" alt="Foto de perfil" class="w-full h-full object-cover">';
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });
})();
</script>
